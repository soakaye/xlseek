# Package manifest for xlseek-core shared library.
# Inputs: library source files under src/; output: rlib crate xlseek_core.
# Errors: Cargo reports compilation or dependency resolution errors.

[package]
name = "xlseek-core"
version = "0.1.0"
description = "Core search engine, parser, models, and export library for Excel Seek"
authors = ["soakaye"]
edition = "2021"

[lib]
name = "xlseek_core"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
same-file = "1.0.6"
calamine = "0.36"
rayon = "1.10"
regex = "1.10"
walkdir = "2.5"
csv = "1.3"
rust_xlsxwriter = "0.65"
chrono = "0.4"
encoding_rs = "0.8.42"
cfb = "0.7.3"
quick-xml = "0.41.0"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
