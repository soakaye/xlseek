# Release workflow: builds the Tauri desktop application bundles and compiles standalone
# xlseek-mcp binary archives for macOS (Apple Silicon), Linux, and Windows, uploading
# both sets of artifacts to a draft GitHub Release attached to the pushed tag.
# Inputs: a pushed version tag matching `v*` (created by `npm version`); releases are
# attached to that same tag without creating separate tags.
# Errors: jobs fail if compilation, packaging, or the GITHUB_TOKEN release upload fails.

name: 'publish'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-mcp-binaries:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            binary_name: 'xlseek-mcp'
            archive_ext: 'tar.gz'
          - platform: 'ubuntu-24.04'
            target: 'x86_64-unknown-linux-gnu'
            binary_name: 'xlseek-mcp'
            archive_ext: 'tar.gz'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            binary_name: 'xlseek-mcp.exe'
            archive_ext: 'zip'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: build xlseek-mcp release binary
        run: cargo build --release -p xlseek-mcp --target ${{ matrix.target }}

      - name: package release archive (unix)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          chmod +x target/${{ matrix.target }}/release/${{ matrix.binary_name }}
          tar -czvf "xlseek-mcp-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" ${{ matrix.binary_name }}

      - name: package release archive (windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -DestinationPath "xlseek-mcp-${{ github.ref_name }}-${{ matrix.target }}.zip" -Force

      - name: upload mcp release asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: xlseek-mcp-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive_ext }}

  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # - platform: 'macos-latest' # for Arm based macs (M1 and above).
          #   args: '--target aarch64-apple-darwin'
          # - platform: 'ubuntu-24.04'
          #   args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf

      - name: install frontend dependencies
        run: npm install # change this to npm, pnpm or bun depending on which one you use.

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Reuse the tag that triggered this run (e.g. v1.0.2). Creating a new tag such as
          # `app-v__VERSION__` from GITHUB_TOKEN fails with "Resource not accessible by integration".
          tagName: ${{ github.ref_name }}
          releaseName: 'Excel Seek v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
