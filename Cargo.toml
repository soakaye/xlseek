# Workspace manifest for exlgrep (core, cli, and tauri packages).
# Inputs: Rust packages under crates/core, crates/cli, and src-tauri; output: shared Cargo workspace and root Cargo.lock.
# Errors: Cargo reports missing or invalid member manifests during metadata/build commands.
# History:
# - v1.0.0 (2026-09-26, Codex): create workspace for locale bundling.
# - v1.1.0 (2026-09-29, Antigravity): add crates/core and crates/cli to workspace members.
# - v1.2.0 (2026-09-29, Antigravity): add patch.crates-io for calamine with bounds-checking fix.
[workspace]
members = [
    "crates/core",
    "crates/cli",
    "src-tauri",
]
resolver = "2"

[patch.crates-io]
calamine = { path = "patches/calamine-0.36.1" }

