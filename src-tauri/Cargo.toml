[package]
name = "exgrep"
version = "0.1.0"
description = "Super fast Excel Grep Desktop Application"
authors = ["you"]
edition = "2021"

[lib]
name = "exgrep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
calamine = "0.36"
rayon = "1.10"
regex = "1.10"
walkdir = "2.5"
open = "5.3"
csv = "1.3"
rust_xlsxwriter = "0.65"
chrono = "0.4"
