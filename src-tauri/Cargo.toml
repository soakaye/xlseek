[package]
name = "xlseek"
version = "0.1.0"
description = "Super fast Excel Grep Desktop Application"
authors = ["soakaye"]
edition = "2021"

[lib]
name = "xlseek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
exlgrep-core = { path = "../crates/core" }
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-os = "2.0.0"
tauri-plugin-shell = "2.0.0"
tauri-plugin-i18n = "2.0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
same-file = "1.0.6"
calamine = "0.36"
rayon = "1.10"
regex = "1.10"
walkdir = "2.5"
open = "5.3"
csv = "1.3"
rust_xlsxwriter = "0.65"
chrono = "0.4"
encoding_rs = "0.8.42"
cfb = "0.7.3"
quick-xml = "0.41.0"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
