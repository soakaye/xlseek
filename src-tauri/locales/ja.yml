cli.HELP: |
  使用方法: exlgrep-cli --path PATH --query TEXT --format csv|xlsx --output PATH [OPTIONS]
  オプション: --match-case BOOL --regex BOOL --values BOOL --formulas BOOL
             --comments BOOL --shapes BOOL --hidden-sheets BOOL
             --extensions LIST --language ja|en --overwrite --help
  既定値: match-case=false regex=false values=true formulas=true comments=true
          shapes=false hidden-sheets=false extensions=.xlsx,.xlsm,.xlsb,.xls language=ja
  --help と -h は --language ja|en だけ併用できます。
