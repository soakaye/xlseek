cli.HELP: |
  Usage: exlgrep-cli --path PATH --query TEXT --format csv|xlsx --output PATH [OPTIONS]
  Options: --match-case BOOL --regex BOOL --values BOOL --formulas BOOL
           --comments BOOL --shapes BOOL --hidden-sheets BOOL
           --extensions LIST --language ja|en --overwrite --help
  Defaults: match-case=false regex=false values=true formulas=true comments=true
            shapes=false hidden-sheets=false extensions=.xlsx,.xlsm,.xlsb,.xls language=ja
  --help and -h may be combined only with --language ja|en.
