# 処理内容: Excel Grep の画面・メニュー・出力に使う翻訳カタログ。
# 入力・出力: dotted key と文字列を入力し、プラグイン用 locale を出力する。
# エラー: 不正な YAML はプラグイン読込時に失敗し、英語カタログへフォールバックする。
# 変更履歴: v1.0.0 (2026-09-26, Codex): tauri-plugin-i18n 移行用に作成。v1.1.0 (2026-09-27, Codex): 検索履歴・パス補完の文言を追加。
